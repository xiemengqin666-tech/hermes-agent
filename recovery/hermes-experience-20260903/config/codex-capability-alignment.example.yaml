# Merge these values into the default Hermes configuration. Keep credentials in .env.
# Do not create collaboration profiles unless the installed official Hermes release does so.
model:
  default: gpt-6-astra
  provider: openai-codex

agent:
  max_turns: 200
  service_tier: normal
  disabled_toolsets: []
  reasoning_effort: medium
  coding_context: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  verify_on_stop: auto
  max_verify_nudges: 2
  verify_guidance: false

compression:
  enabled: true
  threshold: 0.75
  target_ratio: 0.2

session_reset:
  mode: none

auxiliary:
  compression:
    provider: openai-codex
    model: gpt-6-astra
  title_generation:
    provider: openai-codex
    model: gpt-6-astra
  triage_specifier:
    provider: openai-codex
    model: gpt-6-astra
  kanban_decomposer:
    provider: openai-codex
    model: gpt-6-astra

delegation:
  provider: openai-codex
  model: gpt-6-astra
  max_iterations: 250
  reasoning_effort: medium
  max_concurrent_children: 10
  inherit_mcp_toolsets: true
  subagent_auto_approve: true

goals:
  max_turns: 200

approvals:
  mode: 'off'

browser:
  # `off` selects Hermes' built-in browser tools and avoids Browser Use's Chrome harness.
  backend: 'off'
  cloud_provider: local
  use_real_profile: false
  cdp_url: ''

# Required values in ~/.hermes/.env:
# HERMES_BROWSER_EDGE_ONLY=true
# PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
# PUPPETEER_SKIP_DOWNLOAD=true
# AGENT_BROWSER_EXECUTABLE_PATH=/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge
# PUPPETEER_EXECUTABLE_PATH=/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge
# CHROME_PATH=/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge
# BROWSER=open -a Microsoft Edge
